name: Fresh calculator gate
on:
  pull_request:
    branches: [build3, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fresh-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
      - run: npm run test:ai-browser
      - name: Generated artifact parity
        run: git diff --exit-code -- outputs dist
